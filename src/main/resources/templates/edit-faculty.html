<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit faculty</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
          crossorigin="anonymous">
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <meta name="viewport" content="width=device.width, initial-scale=1, shrink-to-fit-no">
</head>
<body>
<div class="container mt-5">
    <div th:replace="parts/navbar :: navbar"></div>
    <br>
    <form method="post" action="/admin/edit-faculty">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <input type="hidden" name="id" th:value="${param.id}">
        <div class="form-group">
            <label for="inputFacultyName">Faculty name: </label>
            <input type="text" name="name" class="form-control" id="inputFacultyName" pattern="[A-z]*">
        </div>
        <div class="form-group">
            <label for="inputBudgetPlacesAmount">Budget places amount: </label>
            <input type="text" name="budgetPlacesAmount" class="form-control" id="inputBudgetPlacesAmount" pattern="^[1-9][0-9]?$|^100$">
        </div>
        <div class="form-group">
            <label for="inputContractPlacesAmount">Contract places amount: </label>
            <input type="text" name="contractPlacesAmount" class="form-control" id="inputContractPlacesAmount" pattern="^[1-9][0-9]?$|^100$">
        </div>
        <div class="form-group">
            <label for="inputPassingGrade">Passing grade: </label>
            <input type="text" name="passingGrade" class="form-control" id="inputPassingGrade" pattern="^[1-9][0-9]{0,2}$">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
</body>
</html>
