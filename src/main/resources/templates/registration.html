<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registration</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
          crossorigin="anonymous">
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <meta name="viewport" content="width=device.width, initial-scale=1, shrink-to-fit-no">
    <link rel="stylesheet" th:href="@{/static/css/table.css}">
</head>
<body>
<div class="container mt-5 main-div-with">
    <form method="post" action="/registration">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <div class="form-group">
            <label for="inputUsername">Username: </label>
            <input type="text" name="username" class="form-control" id="inputUsername" required pattern="[A-z]+">
        </div>
        <div class="form-group">
            <label for="inputFirstName">First name: </label>
            <input type="text" name="firstName" class="form-control" id="inputFirstName" required pattern="[A-z]+">
        </div>
        <div class="form-group">
            <label for="inputLastName">Last name: </label>
            <input type="text" name="lastName" class="form-control" id="inputLastName" required pattern="[A-z]+">
        </div>
        <div class="form-group">
            <label for="inputSecName">Second name: </label>
            <input type="text" name="secondName" class="form-control" id="inputSecName" required pattern="[A-z]+">
        </div>
        <div class="form-group">
            <label for="inputPassword">Password: </label>
            <input type="password" name="password" class="form-control" id="inputPassword" required pattern="[\w\d]+">
        </div>
        <div class="form-group">
            <label for="inputEmail">Email:</label>
            <input type="email" name="email" class="form-control" id="inputEmail">
        </div>
        <div class="form-group">
            <label for="inputCity">City: </label>
            <input type="text" name="city" class="form-control" id="inputCity" required pattern="[A-z]+">
        </div>
        <div class="form-group">
            <label for="inputRegion">Region: </label>
            <input type="text" name="region" class="form-control" id="inputRegion" required pattern="[A-z]+">
        </div>
        <div class="form-group">
            <label for="inputUkrLanguageGrade">Ukrainian language grade: </label>
            <input type="text" name="ukrainianLanguageGrade" class="form-control" id="inputUkrLanguageGrade" required pattern="^[1-9][0-9]?$|^100$">
        </div>
        <div class="form-group">
            <label for="inputMathGrade">Mathematics grade: </label>
            <input type="text" name="mathematicsGrade" class="form-control" id="inputMathGrade" required pattern="^[1-9][0-9]?$|^100$">
        </div>
        <div class="form-group">
            <label for="inputHistoryGrade">History grade: </label>
            <input type="text" name="historyGrade" class="form-control" id="inputHistoryGrade" required pattern="^[1-9][0-9]?$|^100$">
        </div>
        <div class="form-group">
            <label for="inputPhysicsGrade">Physics grade: </label>
            <input type="text" name="physicsGrade" class="form-control" id="inputPhysicsGrade" required pattern="^[1-9][0-9]?$|^100$">
        </div>
        <div class="form-group">
            <label for="inputGeographyGrade">Geography grade: </label>
            <input type="text" name="geographyGrade" class="form-control" id="inputGeographyGrade" required pattern="^[1-9][0-9]?$|^100$">
        </div>
        <div class="form-group">
            <label for="inputEngLanguageGrade">English language grade: </label>
            <input type="text" name="englishLanguageGrade" class="form-control" id="inputEngLanguageGrade" required pattern="^[1-9][0-9]?$|^100$">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        <a class="btn btn-primary float-right" href="/">Back to main page</a>
    </form>
</div>
</body>
</html>
