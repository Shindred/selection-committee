<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
          crossorigin="anonymous">
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <meta name="viewport" content="width=device.width, initial-scale=1, shrink-to-fit-no">
    <link rel="stylesheet" th:href="@{/static/css/table.css}">
</head>
<body>
<div class="container mt-5 main-div-with">
    <div th:replace="parts/navbar :: navbar"></div>
    <table class="styled-table table">
        <thead>
        <tr>
            <th scope="col">Id</th>
            <th scope="col">Username</th>
            <th scope="col">First name</th>
            <th scope="col">Last name</th>
            <th scope="col">Second name</th>
            <th scope="col">Email</th>
            <th scope="col">City</th>
            <th scope="col">Region</th>
            <th scope="col">Is blocked</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="user: ${usersPage.content}">
            <th scope="row" th:text="${user.id}"></th>
            <th scope="row" th:text="${user.username}"></th>
            <th scope="row" th:text="${user.firstName}"></th>
            <th scope="row" th:text="${user.lastName}"></th>
            <th scope="row" th:text="${user.secondName}"></th>
            <th scope="row" th:text="${user.email}"></th>
            <th scope="row" th:text="${user.city}"></th>
            <th scope="row" th:text="${user.region}"></th>
            <th scope="row" th:text="${user.accountNonLocked ? 'No' : 'Yes'}"></th>
            <th scope="row">
                <form method="post" action="/admin/users" th:object="${user}">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <input type="hidden" name="id" th:value="*{id}">
                    <input type="hidden" name="isBanned" th:value="*{!banned}">
                    <input type="submit" th:value="*{banned} ?'Unblock' : 'Block'">
                </form>
            </th>
        </tr>
        </tbody>
    </table>
    <div th:replace="parts/pager :: pager(page=${usersPage})"></div>
</div>
</body>
</html>
