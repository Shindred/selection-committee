<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add faculty</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
          crossorigin="anonymous">
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <meta name="viewport" content="width=device.width, initial-scale=1, shrink-to-fit-no">
    <link rel="stylesheet" th:href="@{/static/css/table.css}">
</head>
<body>
<div class="container mt-5 main-div-with">
    <div th:replace="parts/navbar :: navbar"></div>
    <br>
    <form method="post" action="/admin/faculty">
        <input type="hidden" name="_csrf" th:value="${_csrf.token}">
        <div class="form-group">
            <label for="inputFacultyName">Faculty name: </label>
            <input type="text" name="name" class="form-control" id="inputFacultyName" required pattern="[A-z]+">
        </div>
        <div class="form-group">
            <label for="inputBudgetPlacesAmount">Budget places amount: </label>
            <input type="text" name="budgetPlacesAmount" class="form-control" id="inputBudgetPlacesAmount" required pattern="^[1-9][0-9]?$|^100$">
        </div>
        <div class="form-group">
            <label for="inputContractPlacesAmount">Contract places amount: </label>
            <input type="text" name="contractPlacesAmount" class="form-control" id="inputContractPlacesAmount" required pattern="^[1-9][0-9]?$|^100$">
        </div>
        <div class="form-group">
            <label for="inputPassingGrade">Passing grade: </label>
            <input type="text" name="passingGrade" class="form-control" id="inputPassingGrade" required pattern="^[1-9][0-9]{1,2}$">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
</body>
</html>
