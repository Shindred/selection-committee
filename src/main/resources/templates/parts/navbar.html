<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="navbar navbar-expand-lg navbar-dark custom-navigation"
     th:fragment="navbar"
     th:with="user = ${#authentication?.principal},
     isAuthorized = ${!'anonymousUser'.equals(user) && user != null},
     isAdmin = ${user != null && !'anonymousUser'.equals(user) && user?.authorities?.toString()?.contains('ADMIN')}">
    <a class="navbar-brand" href="/">Selection Committee</a>
    <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav mr-auto">
            <li class="nav-item">
                <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/faculty">View faculties</a>
            </li>
            <li class="nav-item" th:if="${isAdmin}">
                <a class="nav-link" href="/admin/users">View user list</a>
            </li>
            <li class="nav-item" th:if="${isAdmin}">
                <a class="nav-link" href="/admin/faculty">Add faculty</a>
            </li>
            <li class="nav-item" th:if="${isAuthorized}">
                <a class="nav-link" href="/logout">Log out</a>
            </li>
            <li class="nav-item" th:if="${!isAuthorized}">
                <a class="nav-link" href="/login">Log in</a>
            </li>
            <li class="nav-item" th:if="${!isAuthorized}">
                <a class="nav-link" href="/registration">Registration</a>
            </li>
        </ul>
        <div class="navbar-text" th:if="${isAuthorized}">
            <a th:href="@{/user/{userId}(userId = ${user.id})}" th:text="${user.username}">
                Profile
            </a>
        </div>
    </div>
</nav>
</body>
</html>
