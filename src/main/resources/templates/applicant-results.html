<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Applicant Results</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css"
          integrity="sha384-TX8t27EcRE3e/ihU7zmQxVncDAy5uIKz4rEkgIXeMed4M0jlfIDPvg6uqKI2xXr2"
          crossorigin="anonymous">
    <meta http-equiv="Content-Type" content="text/html" charset="UTF-8">
    <meta name="viewport" content="width=device.width, initial-scale=1, shrink-to-fit-no">
    <link rel="stylesheet" th:href="@{/static/css/table.css}">
</head>

<body>
<div class="container mt-5 main-div-with">
    <div th:replace="parts/navbar :: navbar"></div>
    <strong><p class="text-center" th:text="${faculty.name} + ' \'s statement'"></strong>
    <table class="styled-table table">
        <thead>
        <tr>
            <th scope="col">Id</th>
            <th scope="col">Username</th>
            <th scope="col">Faculty</th>
            <th scope="col">Total grade</th>
            <th scope="col">Result</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="appResult: ${applicantResultPage.content}">
            <th scope="row" th:text="${appResult.id}"></th>
            <th scope="row" th:text="${appResult.user.username}"></th>
            <th scope="row" th:text="${appResult.faculty.name}"></th>
            <th scope="row" th:text="${appResult.totalGrade}"></th>
            <th scope="row" th:text="${appResult.enrollmentStatus.name}"></th>
        </tr>
        </tbody>
    </table>

    <form th:if="${!faculty.statementIsFinalized}" method="post" th:action="@{/admin/applicant-result/faculty/{facultyId}(facultyId=${faculty.id})}">
        <p class="text-center">
            <input class="center-block submit-button" type="submit" value="Finalize the statement"/>
        </p>
    </form>

    <p>
    <div th:replace="parts/pager :: pager(page=${applicantResultPage})"></div>
</div>
</body>
</html>
